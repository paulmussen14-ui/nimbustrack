name: CI

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint index.js

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t nimbustrack
